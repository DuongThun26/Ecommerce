spring:
  application:
    name: ecommerce
  main:
    allow-circular-references: true

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

springdoc:
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  servlet:
    context-path: /api/v1

secretkey: ${SECRETKEY}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  payment-url: ${VNPAY_PAYMENT_URL}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  executors:
    dashboard:
      core-size: 4
      max-size: 4
      queue-capacity: 50
  dashboard:
    part-timeout: 1500ms
  demo:
    fail-after-paid: ${DEMO_FAIL_AFTER_PAID:false}
    dashboard:
      delay:
        revenueToday: 0s
        orderCountByStatus: 0s
        top5Products: 0s
        lowStockProducts: 0s
      fail: []
  email:
    outbox:
      backoff-base-seconds: ${EMAIL_OUTBOX_BACKOFF_BASE:60}
  invoice:
    storage:
      local-path: ${INVOICE_STORAGE_PATH:./storage/invoices}
    store-name: "E-COMMERCE STORE"
    store-address: "Tân Mỹ, Nam Từ Liêm, TP Hà Nội"
    store-phone: "+84 976 570 703"
    store-email: ${EMAIL}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-}] %-5level %logger{36} - %msg%n"

cloudinary:
  cloud_name: ${CLOUD_NAME}
  api_key: ${API_KEY}
  api_secret: ${API_SECRET}