spring:
  application:
    name: ecommerce

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

springdoc:
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  servlet:
    context-path: /api/v1

secretkey: ${SECRETKEY}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  payment-url: ${VNPAY_PAYMENT_URL}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}

app:
  invoice:
    storage:
      local-path: ${INVOICE_STORAGE_PATH:./storage/invoices}
    store-name: "E-COMMERCE STORE"
    store-address: "Tân Mỹ, Nam Từ Liêm, TP Hà Nội"
    store-phone: "+84 976 570 703"
    store-email: ${EMAIL}