databaseChangeLog:
  - changeSet:
      id: 020-create-invoices-and-invoice-items
      author: thuan
      changes:
        - createSequence:
            sequenceName: invoice_number_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_invoices
                    nullable: false
              - column:
                  name: invoice_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_invoices_invoice_number
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_invoices_order_id
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: issue_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: discount_amount
                  type: DECIMAL(19,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: tax_amount
                  type: DECIMAL(19,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: billing_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: billing_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: billing_phone
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: billing_address
                  type: VARCHAR(500)
              - column:
                  name: payment_method
                  type: VARCHAR(30)
              - column:
                  name: payment_transaction_ref
                  type: VARCHAR(100)
              - column:
                  name: pdf_storage_key
                  type: VARCHAR(500)
              - column:
                  name: pdf_generated_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: invoices
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_invoices_order

        - addForeignKeyConstraint:
            baseTableName: invoices
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: id
            constraintName: fk_invoices_customer

        - createTable:
            tableName: invoice_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_invoice_items
                    nullable: false
              - column:
                  name: invoice_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: unit_price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: subtotal
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: invoice_items
            baseColumnNames: invoice_id
            referencedTableName: invoices
            referencedColumnNames: id
            constraintName: fk_invoice_items_invoice
            onDelete: CASCADE

        - createIndex:
            tableName: invoices
            indexName: idx_invoices_customer_id
            columns:
              - column:
                  name: customer_id

        - createIndex:
            tableName: invoices
            indexName: idx_invoices_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at

        - createIndex:
            tableName: invoices
            indexName: idx_invoices_issue_date
            columns:
              - column:
                  name: issue_date

        - createIndex:
            tableName: invoice_items
            indexName: idx_invoice_items_invoice_id
            columns:
              - column:
                  name: invoice_id
