databaseChangeLog:
  - changeSet:
      id: 019-create-purchase-tickets-table
      author: thuan
      changes:
        - createTable:
            tableName: purchase_tickets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticket_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reviewer_id
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: review_notes
                  type: TEXT
              - column:
                  name: rejection_reason
                  type: VARCHAR(500)
              - column:
                  name: returned_reason
                  type: VARCHAR(500)
              - column:
                  name: reviewed_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: purchase_tickets
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_purchase_tickets_order
        - addForeignKeyConstraint:
            baseTableName: purchase_tickets
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: id
            constraintName: fk_purchase_tickets_customer
        - addForeignKeyConstraint:
            baseTableName: purchase_tickets
            baseColumnNames: reviewer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_purchase_tickets_reviewer
        - createIndex:
            tableName: purchase_tickets
            indexName: idx_purchase_tickets_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
        - createIndex:
            tableName: purchase_tickets
            indexName: idx_purchase_tickets_order_id
            columns:
              - column:
                  name: order_id
        - createIndex:
            tableName: purchase_tickets
            indexName: idx_purchase_tickets_customer_id
            columns:
              - column:
                  name: customer_id
