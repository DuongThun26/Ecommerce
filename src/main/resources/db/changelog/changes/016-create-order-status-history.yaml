databaseChangeLog:
  - changeSet:
      id: 016-create-order-status-history
      author: thuan
      changes:
        - createTable:
            tableName: order_status_history
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: from_status
                  type: VARCHAR(30)
              - column:
                  name: to_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: actor_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: actor_identifier
                  type: VARCHAR(100)
              - column:
                  name: reason
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: order_status_history
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_order_status_history_order
        - createIndex:
            tableName: order_status_history
            indexName: idx_order_status_history_order_created_at
            columns:
              - column:
                  name: order_id
              - column:
                  name: created_at
