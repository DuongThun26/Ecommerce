databaseChangeLog:
  - changeSet:
      id: 014-create-payments
      author: thuan

      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payments
                    nullable: false

              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: total_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: payment_method
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_ref
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_payments_transaction_ref

              - column:
                  name: transaction_no
                  type: VARCHAR(100)

              - column:
                  name: response_code
                  type: VARCHAR(10)

              - column:
                  name: transaction_status
                  type: VARCHAR(10)

              - column:
                  name: bank_code
                  type: VARCHAR(50)

              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: payments
            baseColumnNames: order_id
            constraintName: fk_payments_order
            referencedTableName: orders
            referencedColumnNames: id
            onDelete: RESTRICT
            onUpdate: CASCADE

        - createIndex:
            tableName: payments
            indexName: idx_payments_order_id
            columns:
              - column:
                  name: order_id