databaseChangeLog:
  - changeSet:
      id: 028-create-idempotency-keys
      author: ant-agent
      changes:
        - createTable:
            tableName: idempotency_keys
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_idempotency_keys
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_idempotency_keys_key
              - column:
                  name: endpoint
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: request_hash
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: response_status
                  type: INT
              - column:
                  name: response_body
                  type: TEXT
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - createIndex:
            tableName: idempotency_keys
            indexName: idx_idempotency_keys_status
            columns:
              - column:
                  name: status
