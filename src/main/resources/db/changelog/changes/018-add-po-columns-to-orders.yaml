databaseChangeLog:
  - changeSet:
      id: 018-add-po-columns-to-orders
      author: thuan
      changes:
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: approved_by
                  type: BIGINT
              - column:
                  name: approved_at
                  type: TIMESTAMP
              - column:
                  name: rejected_reason
                  type: VARCHAR(500)
              - column:
                  name: returned_reason
                  type: VARCHAR(500)
              - column:
                  name: review_notes
                  type: TEXT
        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: approved_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_orders_approved_by_user
        - createIndex:
            tableName: orders
            indexName: idx_orders_status_created_at
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
