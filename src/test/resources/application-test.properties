# Unit Testing Configuration
# Uses H2 in-memory database for fast unit tests (no containers needed)

spring.application.name=ecommerce-test

# H2 In-Memory Database (for fast unit tests)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable Liquibase for unit tests (Hibernate will handle schema)
spring.liquibase.enabled=false

# Disable batch job for tests
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# Redis (use embedded Redis or mock)
spring.redis.host=localhost
spring.redis.port=6379

# Disable security for easier testing (can override per test)
spring.security.user.name=testuser
spring.security.user.password=testpass

# Logging
logging.level.root=INFO
logging.level.com.example.ecommerce=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Secret (use test value)
secretkey=test-secret-key-for-testing-only-do-not-use-in-production-1234567890

# Server
server.port=8080
server.servlet.context-path=/api/v1
