# Integration Testing Configuration
# Uses PostgreSQL Testcontainers for full integration tests

spring.application.name=ecommerce-integrationtest

# PostgreSQL (via Testcontainers)
# These will be overridden by Testcontainers at runtime
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable Liquibase for integration tests (Hibernate will handle schema)
spring.liquibase.enabled=false

# Disable batch job for tests
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# Redis (use embedded Redis or mock)
spring.redis.host=localhost
spring.redis.port=6379

# Security
spring.security.user.name=testuser
spring.security.user.password=testpass

# Logging - less verbose than unit tests
logging.level.root=WARN
logging.level.com.example.ecommerce=INFO
logging.level.org.springframework.test.context.cache=WARN
logging.level.org.springframework.test.context=WARN

# JWT Secret (use test value)
secretkey=test-secret-key-for-integration-testing-only-do-not-use-in-production-1234567890

# Server
server.port=0
server.servlet.context-path=/api/v1
